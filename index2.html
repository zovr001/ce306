<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือแปลงสกุลเงิน</title>
    <!-- นำเข้าฟอนต์ Mitr และ Prompt จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4a3e3d; /* น้ำตาลเข้ม ละมุนตา */
            --bg-color: #fcf8f5; /* สีครีมอ่อน นุ่มนวล */
            --card-bg: #ffffff;
            --accent-color: #e2b897; /* อุ่นๆ แบบมินิมอล */
            --accent-hover: #d19a73;
            --text-main: #5c4b51;
            --text-muted: #8c7a6b;
            --border-color: #f0e6df;
        }

        
        body {
            /* ใช้ฟอนต์ Mitr สำหรับหัวข้อ และ Prompt สำหรับเนื้อหา */
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Mitr', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(165, 140, 130, 0.1);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin: 0;
            color: var(--primary-color);
            font-weight: 500;
        }

        .rate-box {
            background-color: #fdfbf7;
            border: 1.5px dashed var(--accent-color);
            padding: 12px 16px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .rate-box strong {
            color: var(--primary-color);
        }

        .converter-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            position: relative;
        }

        .input-group {
            background-color: #faf7f5;
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 14px 18px;
            transition: all 0.2s ease;
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            background-color: #fff;
            box-shadow: 0 4px 12px rgba(226, 184, 151, 0.15);
        }

        .label-and-flag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .label-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .currency-tag {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 500;
            font-family: 'Mitr', sans-serif;
        }

        .currency-tag.thb {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .currency-tag.usd {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .input-field {
            font-family: 'Mitr', sans-serif;
            font-size: 1.8rem;
            font-weight: 500;
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            color: var(--primary-color);
            text-align: right;
        }

        .swap-icon-container {
            display: flex;
            justify-content: center;
            margin: -6px 0;
            z-index: 2;
        }

        .swap-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--primary-color);
            font-size: 1.2rem;
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .swap-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            transform: rotate(180deg);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Mitr', sans-serif;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-reset {
            background-color: #f5eeea;
            color: var(--text-main);
        }

        .btn-reset:hover {
            background-color: #ebdcd5;
        }

        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-refresh:hover {
            background-color: var(--accent-hover);
        }

        .history-panel {
            margin-top: 28px;
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 1rem;
            color: var(--primary-color);
            margin: 0;
            font-weight: 500;
        }

        .history-count {
            color: var(--accent-hover);
            font-size: 0.85rem;
        }

        .btn-clear-history {
            padding: 6px 12px;
            font-size: 0.8rem;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
        }

        .btn-clear-history:hover {
            background-color: #fff0f0;
            border-color: #ffcdd2;
            color: #e53935;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            background-color: #faf7f5;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
        }

        .history-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            padding: 16px;
            background-color: #faf7f5;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>แปลงสกุลเงิน</h1>
        </div>

        <div class="rate-box">
            <span><strong>1 USD</strong> = 32.75 THB</span> &nbsp;•&nbsp; <span><strong>1 THB</strong> = 0.0305 USD</span>
        </div>

        <div class="converter-row">
            <div class="input-group">
                <div class="label-and-flag">
                    <span class="label-text">จำนวนเงินต้นทาง</span>
                    <span class="currency-tag thb" id="fromTag">THB</span>
                </div>
                <input type="number" class="input-field" id="amountOne" value="1000.00" placeholder="0.00">
            </div>
            
            <div class="swap-icon-container">
                <button class="swap-btn" id="swapBtn">⇆</button>
            </div>

            <div class="input-group">
                <div class="label-and-flag">
                    <span class="label-text">จำนวนเงินปลายทาง</span>
                    <span class="currency-tag usd" id="toTag">USD</span>
                </div>
                <input type="number" class="input-field" id="amountTwo" value="30.53" placeholder="0.00">
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-reset" id="resetBtn">ล้างข้อมูล</button>
            <button class="btn btn-refresh" id="refreshBtn">รีเฟรชอัตรา</button>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h3 class="history-title">ประวัติการแปลงเงิน <span class="history-count">0/10</span></h3>
                <button class="btn-clear-history" id="clearHistoryBtn">ล้างประวัติ</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-empty" id="historyEmpty">ยังไม่มีประวัติการแปลงเงิน</li>
            </ul>
        </div>
    </div>

    <script>
        const usdToThbRate = 32.75;
        const thbToUsdRate = 0.03053435;

        const amountOneEl = document.getElementById('amountOne');
        const amountTwoEl = document.getElementById('amountTwo');
        const swapBtn = document.getElementById('swapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const historyList = document.getElementById('historyList');
        const historyEmptyEl = document.getElementById('historyEmpty');
        const fromTag = document.getElementById('fromTag');
        const toTag = document.getElementById('toTag');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        let isSwap = false;
        const maxHistory = 10;
        let historyArray = [];

        function calculateFromOne() {
            const amountOne = parseFloat(amountOneEl.value);
            let result;
            
            if (isNaN(amountOne)) {
                amountTwoEl.value = "";
                return;
            }

            if (!isSwap) {
                result = amountOne * usdToThbRate;
            } else {
                result = amountOne * thbToUsdRate;
            }
            amountTwoEl.value = result.toFixed(2);
            addToHistory(amountOne, result, !isSwap);
        }

        function calculateFromTwo() {
            const amountTwo = parseFloat(amountTwoEl.value);
            if (isNaN(amountTwo)) {
                amountOneEl.value = "";
                return;
            }

            let result;
            if (!isSwap) {
                result = amountTwo / usdToThbRate;
            } else {
                result = amountTwo / thbToUsdRate;
            }
            amountOneEl.value = result.toFixed(2);
            addToHistory(amountTwo, result, isSwap);
        }

        function addToHistory(fromAmount, toAmount, isUsdToThb) {
            let fromCurrency = isUsdToThb ? 'USD' : 'THB';
            let toCurrency = isUsdToThb ? 'THB' : 'USD';
            
            fromAmount = parseFloat(fromAmount).toFixed(2);
            toAmount = parseFloat(toAmount).toFixed(2);

            const timestamp = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            const historyText = `${fromAmount} ${fromCurrency} → ${toAmount} ${toCurrency}`;
            
            historyArray.unshift({ text: historyText, time: timestamp });
            if (historyArray.length > maxHistory) {
                historyArray.pop();
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            historyList.innerHTML = '';
            
            if (historyArray.length === 0) {
                historyList.appendChild(historyEmptyEl);
                document.querySelector('.history-count').innerText = `0/10`;
                return;
            }

            historyEmptyEl.remove();
            document.querySelector('.history-count').innerText = `${historyArray.length}/10`;

            historyArray.forEach(item => {
                const li = document.createElement('li');
                li.classList.add('history-item');
                li.innerHTML = `
                    <span>${item.text}</span>
                    <span style="color: var(--text-muted);">${item.time}</span>
                `;
                historyList.appendChild(li);
            });
        }

        amountOneEl.addEventListener('input', calculateFromOne);
        amountTwoEl.addEventListener('input', calculateFromTwo);

        swapBtn.addEventListener('click', () => {
            isSwap = !isSwap;
            if (!isSwap) {
                fromTag.innerText = 'THB';
                fromTag.className = 'currency-tag thb';
                toTag.innerText = 'USD';
                toTag.className = 'currency-tag usd';
            } else {
                fromTag.innerText = 'USD';
                fromTag.className = 'currency-tag usd';
                toTag.innerText = 'THB';
                toTag.className = 'currency-tag thb';
            }
            calculateFromOne();
        });

        resetBtn.addEventListener('click', () => {
            amountOneEl.value = "1000.00";
            isSwap = false;
            fromTag.innerText = 'THB';
            fromTag.className = 'currency-tag thb';
            toTag.innerText = 'USD';
            toTag.className = 'currency-tag usd';
            calculateFromOne();
        });

        clearHistoryBtn.addEventListener('click', () => {
            historyArray = [];
            updateHistoryUI();
        });

        calculateFromOne();
    </script>
</body>
</html>
