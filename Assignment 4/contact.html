<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech & AI Hub - ติดต่อเรา</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-microchip me-2"></i>TechInterest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">หน้าแรก</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">เทคโนโลยี AI</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">ติดต่อเรา</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title fw-bold text-center mb-4">ฟอร์มติดต่อสอบถาม</h3>
                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">ชื่อ - นามสกุล</label>
                                <input type="text" class="form-control" id="fullName" placeholder="กรอกชื่อและนามสกุล" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">อีเมล</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="topic" class="form-label">หัวข้อที่สนใจ</label>
                                <select class="form-select" id="topic">
                                    <option selected>เลือกหัวข้อ...</option>
                                    <option value="1">Artificial Intelligence</option>
                                    <option value="2">Cybersecurity</option>
                                    <option value="3">Future Gadgets</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">ข้อความ / ข้อเสนอแนะ</label>
                                <textarea class="form-control" id="message" rows="4" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">ส่งข้อความ</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 TechInterest Website. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
