<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นับเงิน - โปรแกรมบัญชีรายรับ-รายจ่าย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdf6f8;
            --card-bg: #ffffff;
            --primary-pink: #ec4899;
            --primary-hover: #db2777;
            --soft-pink: #fbcfe8;
            --light-pink: #fdf2f8;
            --dark-pink: #9d174d;
            --text-main: #4a5568;
            --text-muted: #9ca3af;
            --border-color: #f472b6;
            --border-light: #fce7f3;
            --shadow-sm: 0 2px 8px rgba(236, 72, 153, 0.08);
            --shadow-md: 0 4px 15px rgba(236, 72, 153, 0.12);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 24px;
            border: 1px solid var(--border-light);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-pink);
            letter-spacing: -0.5px;
        }

        .date-badge {
            font-size: 13px;
            color: var(--dark-pink);
            background: var(--light-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Dashboard Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            color: white;
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25);
            margin-bottom: 24px;
        }

        .balance-title {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .summary-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            text-align: left;
        }

        .summary-label {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-income { background-color: #4ade80; }
        .dot-expense { background-color: #f87171; }

        .summary-value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Form Section */
        .card-section {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark-pink);
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            background-color: var(--light-pink);
            outline: none;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            font-size: 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            background-color: #fff;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* History List */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .count-badge {
            font-size: 12px;
            color: var(--text-muted);
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.2s;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-category-tag {
            font-size: 11px;
            background: var(--light-pink);
            color: var(--dark-pink);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .item-name {
            font-size: 14px;
            font-weight: 500;
        }

        .item-amount {
            font-size: 14px;
            font-weight: 600;
        }

        .amount-income { color: #16a34a; }
        .amount-expense { color: #dc2626; }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Clear Button */
        .btn-clear {
            width: 100%;
            background-color: #fff0f5;
            color: #e11d48;
            border: 1px solid #fecdd3;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-clear:hover {
            background-color: #ffe4e6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header-bar">
        <div class="logo">นับเงิน</div>
        <div class="date-badge" id="currentDate">31 ส.ค. 2569</div>
    </div>

    <!-- สรุปรายงานการเงิน -->
    <div class="balance-card">
        <div class="balance-title">คงเหลือสุทธิ</div>
        <div class="balance-amount" id="netBalance">฿0.00</div>
        <div class="summary-grid">
            <div class="summary-box">
                <div class="summary-label"><span class="dot dot-income"></span> รายรับ</div>
                <div class="summary-value" id="totalIncome">฿0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label"><span class="dot dot-expense"></span> รายจ่าย</div>
                <div class="summary-value" id="totalExpense">฿0.00</div>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="card-section">
        <div class="section-title">เพิ่มรายการใหม่</div>
        <form id="transactionForm">
            <div class="form-group">
                <label class="form-label">ชื่อรายการ</label>
                <input type="text" id="itemName" class="form-control" placeholder="เช่น ข้าวมันไก่, ค่าน้ำมัน" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">จำนวนเงิน (฿)</label>
                    <input type="number" id="itemAmount" class="form-control" placeholder="0.00" min="0" step="any" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ประเภท</label>
                    <select id="itemType" class="form-control">
                        <option value="expense">รายจ่าย</option>
                        <option value="income">รายรับ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">หมวดหมู่</label>
                    <select id="itemCategory" class="form-control">
                        <option value="อาหาร">🍱 อาหาร</option>
                        <option value="เดินทาง">🚗 เดินทาง</option>
                        <option value="ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
                        <option value="เงินเดือน">💰 เงินเดือน</option>
                        <option value="อื่นๆ">📦 อื่นๆ</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">+ เพิ่มรายการ</button>
        </form>
    </div>

    <!-- ค้นหารายการ -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อรายการ...">
    </div>

    <!-- แสดงประวัติรายการทั้งหมด -->
    <div class="card-section">
        <div class="history-header">
            <div class="section-title" style="margin-bottom:0;">ประวัติรายการ</div>
            <div class="count-badge"><span id="recordCount">0</span> รายการ</div>
        </div>

        <ul class="transaction-list" id="transactionList"></ul>
        
        <div class="empty-state" id="emptyState">
            ยังไม่มีรายการธุรกรรม เริ่มเพิ่มรายการแรกของคุณด้านบน
        </div>
    </div>

    <!-- ล้างประวัติทั้งหมด -->
    <button class="btn-clear" id="btnClearAll">🗑️ ล้างข้อมูลทั้งหมด</button>
</div>

<script>
    let records = [];

    const form = document.getElementById('transactionForm');
    const itemNameInput = document.getElementById('itemName');
    const itemAmountInput = document.getElementById('itemAmount');
    const itemTypeSelect = document.getElementById('itemType');
    const itemCategorySelect = document.getElementById('itemCategory');
    const searchInput = document.getElementById('searchInput');
    const transactionList = document.getElementById('transactionList');
    const emptyState = document.getElementById('emptyState');
    const btnClearAll = document.getElementById('btnClearAll');

    const netBalanceEl = document.getElementById('netBalance');
    const totalIncomeEl = document.getElementById('totalIncome');
    const totalExpenseEl = document.getElementById('totalExpense');
    const recordCountEl = document.getElementById('recordCount');

    function updateSummary() {
        let incomeSum = 0;
        let expenseSum = 0;

        records.forEach(item => {
            if (item.type === 'income') {
                incomeSum += item.amount;
            } else {
                expenseSum += item.amount;
            }
        });

        const net = incomeSum - expenseSum;

        totalIncomeEl.textContent = `฿${incomeSum.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        totalExpenseEl.textContent = `฿${expenseSum.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        netBalanceEl.textContent = `฿${net.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function renderList(filterKeyword = '') {
        transactionList.innerHTML = '';

        const filtered = records.filter(item => 
            item.title.toLowerCase().includes(filterKeyword.toLowerCase())
        );

        recordCountEl.textContent = filtered.length;

        if (filtered.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';

            filtered.forEach((item) => {
                const li = document.createElement('li');
                li.className = 'transaction-item';

                const isIncome = item.type === 'income';
                const amountSign = isIncome ? '+' : '-';
                const amountClass = isIncome ? 'amount-income' : 'amount-expense';

                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-category-tag">${item.category}</span>
                        <div>
                            <div class="item-name">#${item.id} ${item.title}</div>
                        </div>
                    </div>
                    <div class="item-amount ${amountClass}">
                        ${amountSign}฿${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                    </div>
                `;

                transactionList.appendChild(li);
            });
        }

        updateSummary();
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const title = itemNameInput.value.trim();
        const amount = parseFloat(itemAmountInput.value);
        const type = itemTypeSelect.value;
        const category = itemCategorySelect.value;

        if (!title || isNaN(amount) || amount <= 0) return;

        const newRecord = {
            id: records.length + 1,
            title: title,
            amount: amount,
            type: type,
            category: category
        };

        records.unshift(newRecord);

        itemNameInput.value = '';
        itemAmountInput.value = '';
        itemTypeSelect.value = 'expense';
        itemCategorySelect.value = 'อาหาร';

        renderList(searchInput.value);
    });

    searchInput.addEventListener('input', function(e) {
        renderList(e.target.value);
    });

    btnClearAll.addEventListener('click', function() {
        if (records.length === 0) {
            alert('ไม่มีข้อมูลให้ล้าง');
            return;
        }

        const isConfirmed = confirm('คุณต้องการล้างข้อมูลประวัติทั้งหมดใช่หรือไม่?');
        if (isConfirmed) {
            records = [];
            renderList();
        }
    });

    renderList();
</script>

</body>
</html>
